<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunecamp Community Samples - Free Sample Packs</title>
    <meta name="description" content="Browse and download free samples and sample packs shared across the open TuneCamp federation.">
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <script src="vendor/tailwind.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
        @theme {
            --color-primary: #2997ff;
            --color-primary-hover: #5cb3ff;
            --color-bg-base: #000000;
            --color-bg-surface: #272729;
            --color-bg-surface-alt: #2a2a2c;
            --color-text-base: #ffffff;
            --color-text-muted: #8c8c8c;
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
        }
        body {
            @apply bg-bg-base text-text-base font-sans antialiased selection:bg-primary/30;
        }
        .glass-panel {
            @apply bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.5)];
        }
        .sample-card {
            @apply glass-panel rounded-2xl p-5 flex flex-col gap-3 hover:border-primary/30 transition-colors;
        }
        .badge {
            @apply px-2 py-0.5 rounded-full text-[11px] font-mono bg-white/5 border border-white/10 text-text-muted;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-primary/10 blur-[150px] rounded-full pointer-events-none -z-10"></div>

    <header class="p-6 flex items-center justify-between z-10 bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors text-text-muted hover:text-white" title="Back to Explore">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="font-display text-xl sm:text-2xl font-bold">Community Samples</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 px-3 py-1.5 bg-white/5 rounded-full border border-white/10 text-xs font-medium">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
                <span id="statusText" class="text-text-muted">Connecting...</span>
            </div>
            <div class="flex flex-col items-center text-sm font-mono text-text-muted/60">
                <span id="sampleCount" class="text-white font-bold">-</span>
                <span class="text-[10px] uppercase tracking-wider">Samples</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-6 pb-16">
        <div class="glass-panel rounded-3xl p-6 mb-8 flex flex-col sm:flex-row gap-4">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-text-muted"></i>
                <input type="text" id="searchInput" aria-label="Search samples or artists" placeholder="Search samples or artists..." oninput="filterSamples()" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 focus:outline-none focus:border-primary/50 text-white placeholder-text-muted transition-colors">
            </div>
            <select id="licenseFilter" aria-label="Filter by license" onchange="filterSamples()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-primary/50 text-white appearance-none">
                <option value="" class="bg-bg-surface text-white">All Licenses</option>
            </select>
        </div>

        <div id="samplesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full flex flex-col items-center justify-center h-64 text-center p-8">
                <i class="fas fa-circle-notch fa-spin text-4xl text-primary/50 mb-4"></i>
                <p class="text-text-muted">Loading samples from the community...</p>
            </div>
        </div>
    </main>

    <!-- Federated discovery over HTTP — no Zen, queries /api/community/sites -->
    <script src="config.js"></script>
    <script type="module">
        let allSamples = [];
        let filteredSamples = [];

        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (state === 'live') {
                dot.className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
                text.textContent = 'Live';
            } else if (state === 'connecting') {
                dot.className = 'w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]';
                text.textContent = 'Connecting...';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
                text.textContent = 'Offline';
            }
        }

        async function loadSamples() {
            const samplesMap = new Map();
            const licensesSet = new Set();
            const processedSites = new Set();

            const processSite = async (siteUrl) => {
                const origin = (siteUrl || '').replace(/\/$/, '');
                if (!origin || processedSites.has(origin)) return;
                processedSites.add(origin);
                try {
                    const res = await fetch(`${origin}/api/samples?limit=100`, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) return;
                    const samples = await res.json();
                    (Array.isArray(samples) ? samples : []).forEach(s => {
                        if (!s || !s.id) return;
                        const sd = {
                            id: s.id, title: s.title || 'Untitled',
                            artistName: s.artistName || 'Unknown Artist',
                            bpm: s.bpm, musicalKey: s.musicalKey, tags: s.tags || [],
                            license: s.license || 'cc0', format: s.format,
                            downloadCount: s.downloadCount || 0,
                            downloadUrl: `${origin}/api/samples/${s.id}/download`,
                            createdAt: s.createdAt || Date.now(),
                        };
                        samplesMap.set(`${origin}:${sd.id}`, sd);
                        licensesSet.add(sd.license);
                    });
                    updateSamplesList(samplesMap, licensesSet);
                } catch (err) {}
            };

            const directories = Array.isArray(window.TUNECAMP_DIRECTORY) ? window.TUNECAMP_DIRECTORY : [];
            if (directories.length === 0) {
                setStatus('offline');
            } else {
                setStatus('connecting');
                let reached = 0;
                await Promise.all(directories.map(async (base) => {
                    const origin = (base || '').replace(/\/$/, '');
                    if (!origin) return;
                    try {
                        const res = await fetch(`${origin}/api/community/sites`, { headers: { 'Accept': 'application/json' } });
                        if (!res.ok) return;
                        const sites = await res.json();
                        reached++;
                        await Promise.all((Array.isArray(sites) ? sites : []).map(s => processSite(s.url)));
                    } catch (err) {}
                }));
                setStatus(reached > 0 ? 'live' : 'offline');
            }

            setTimeout(() => {
                if (allSamples.length === 0) {
                    document.getElementById('samplesContainer').innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center h-64 text-center p-8">
                            <i class="fas fa-drum text-4xl text-white/20 mb-4"></i>
                            <p class="text-text-muted">No samples found yet. Join the network!</p>
                        </div>
                    `;
                }
            }, 5000);
        }

        function updateSamplesList(samplesMap, licensesSet) {
            allSamples = Array.from(samplesMap.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById('sampleCount').textContent = allSamples.length;

            const select = document.getElementById('licenseFilter');
            const current = select.value;
            select.innerHTML = '<option value="" class="bg-bg-surface text-white">All Licenses</option>';
            Array.from(licensesSet).sort().forEach(l => {
                select.innerHTML += `<option value="${escapeHtml(l)}" class="bg-bg-surface text-white">${escapeHtml(l.toUpperCase())}</option>`;
            });
            select.value = current;

            filterSamples();
        }

        function filterSamples() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const lic = document.getElementById('licenseFilter').value;
            filteredSamples = allSamples.filter(s => {
                const mq = !q || s.title.toLowerCase().includes(q) || s.artistName.toLowerCase().includes(q);
                const ml = !lic || s.license === lic;
                return mq && ml;
            });
            renderSamples();
        }

        function renderSamples() {
            const container = document.getElementById('samplesContainer');
            if (filteredSamples.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-text-muted">No samples match your search.</div>`;
                return;
            }
            container.innerHTML = filteredSamples.map(s => {
                const badges = [
                    s.bpm ? `<span class="badge">${s.bpm} BPM</span>` : '',
                    s.musicalKey ? `<span class="badge">${escapeHtml(s.musicalKey)}</span>` : '',
                    s.format ? `<span class="badge">${escapeHtml(s.format.toUpperCase())}</span>` : '',
                    `<span class="badge">${escapeHtml((s.license || '').toUpperCase())}</span>`,
                ].filter(Boolean).join('');
                return `
                    <div class="sample-card">
                        <div>
                            <div class="text-white font-medium truncate">${escapeHtml(s.title)}</div>
                            <div class="text-xs text-primary truncate">${escapeHtml(s.artistName)}</div>
                        </div>
                        <div class="flex flex-wrap gap-1.5">${badges}</div>
                        <audio controls preload="none" class="w-full h-9" src="${escapeHtml(s.downloadUrl)}"></audio>
                        <a href="${escapeHtml(s.downloadUrl)}" class="text-center bg-primary/20 text-primary border border-primary/30 rounded-xl py-2 hover:bg-primary/30 transition-colors text-sm font-medium">
                            <i class="fas fa-download mr-1.5"></i>Download
                        </a>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : ''; }

        window.filterSamples = filterSamples;
        loadSamples();
    </script>
</body>
</html>
