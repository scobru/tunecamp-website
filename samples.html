<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunecamp Community Samples - Free Sample Packs</title>
    <meta name="description" content="Browse and download free samples and sample packs shared across the open TuneCamp federation.">
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <script src="vendor/tailwind.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
        @theme {
            --color-primary: oklch(65% 0.28 290);
            --color-primary-hover: oklch(75% 0.22 290);
            --color-bg-base: oklch(10% 0.01 280);
            --color-bg-surface: oklch(14% 0.01 280);
            --color-bg-surface-alt: oklch(18% 0.02 280);
            --color-text-base: oklch(98% 0.005 280);
            --color-text-muted: oklch(80% 0.02 280);
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }
        body {
            @apply bg-bg-base text-text-base font-sans antialiased selection:bg-primary/30;
        }
        .glass-panel {
            @apply bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.5)];
        }
        .sample-card {
            @apply bg-white/5 backdrop-blur-2xl border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.5)] rounded-2xl p-5 flex flex-col gap-3 hover:border-primary/30 hover:-translate-y-0.5 transition-all;
        }
        .sample-cover {
            @apply relative h-24 rounded-xl overflow-hidden cursor-pointer bg-gradient-to-br from-primary/15 via-white/5 to-transparent flex items-center justify-center;
        }
        .sample-wave, .sample-wave-progress {
            position: absolute; inset: 0.75rem;
            -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        }
        .sample-wave { background-color: rgba(255,255,255,0.25); }
        .sample-wave-progress { background-color: #22c55e; clip-path: inset(0 100% 0 0); }
        .sample-play {
            @apply absolute inset-0 flex items-center justify-center bg-black/0 hover:bg-black/30 transition-colors;
        }
        .sample-play i {
            @apply w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-xs opacity-0 scale-90 transition-all;
        }
        .sample-cover:hover .sample-play i { @apply opacity-100 scale-100; }
        .pack-cover {
            @apply relative h-24 rounded-xl overflow-hidden bg-gradient-to-br from-white/15 via-white/5 to-transparent flex items-center justify-center text-3xl text-white/30;
        }
        .badge {
            @apply px-2 py-0.5 rounded-full text-[11px] font-mono bg-white/5 border border-white/10 text-text-muted;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-primary/10 blur-[150px] rounded-full pointer-events-none -z-10"></div>

    <header class="p-6 flex items-center justify-between z-10 bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors text-text-muted hover:text-white" title="Back to Explore">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="font-display text-xl sm:text-2xl font-bold">Community Samples</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 px-3 py-1.5 bg-white/5 rounded-full border border-white/10 text-xs font-medium">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
                <span id="statusText" class="text-text-muted">Connecting...</span>
            </div>
            <div class="flex flex-col items-center text-sm font-mono text-text-muted/60">
                <span id="sampleCount" class="text-white font-bold">-</span>
                <span class="text-[10px] uppercase tracking-wider">Samples</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-6 pb-16">
        <div class="glass-panel rounded-3xl p-6 mb-8 flex flex-col sm:flex-row gap-4">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-text-muted"></i>
                <input type="text" id="searchInput" aria-label="Search samples or artists" placeholder="Search samples or artists..." oninput="filterSamples()" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-11 pr-4 focus:outline-none focus:border-primary/50 text-white placeholder-text-muted transition-colors">
            </div>
            <select id="licenseFilter" aria-label="Filter by license" onchange="filterSamples()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-primary/50 text-white appearance-none">
                <option value="" class="bg-bg-surface text-white">All Licenses</option>
            </select>
            <select id="tagFilter" aria-label="Filter by tag" onchange="filterSamples()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-primary/50 text-white appearance-none">
                <option value="" class="bg-bg-surface text-white">All Tags</option>
            </select>
        </div>

        <div id="samplesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full flex flex-col items-center justify-center h-64 text-center p-8">
                <i class="fas fa-circle-notch fa-spin text-4xl text-primary/50 mb-4"></i>
                <p class="text-text-muted">Loading samples from the community...</p>
            </div>
        </div>
    </main>

    <!-- Federated discovery over HTTP — no Zen, queries /api/community/sites -->
    <script src="config.js"></script>
    <script type="module">
        let allSamples = [];
        let filteredSamples = [];
        let allPacks = [];
        let filteredPacks = [];

        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (state === 'live') {
                dot.className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
                text.textContent = 'Live';
            } else if (state === 'connecting') {
                dot.className = 'w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]';
                text.textContent = 'Connecting...';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
                text.textContent = 'Offline';
            }
        }

        async function loadSamples() {
            const samplesMap = new Map();
            const packsMap = new Map();
            const licensesSet = new Set();
            const tagsSet = new Set();
            const processedSites = new Set();

            const processSite = async (siteUrl) => {
                const origin = (siteUrl || '').replace(/\/$/, '');
                if (!origin || processedSites.has(origin)) return;
                processedSites.add(origin);
                try {
                    const res = await fetch(`${origin}/api/samples?limit=100`, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) return;
                    const samples = await res.json();
                    (Array.isArray(samples) ? samples : []).forEach(s => {
                        if (!s || !s.id) return;
                        const sd = {
                            id: s.id, title: s.title || 'Untitled',
                            artistName: s.artistName || 'Unknown Artist',
                            bpm: s.bpm, musicalKey: s.musicalKey, tags: s.tags || [],
                            license: s.license || 'cc0', format: s.format,
                            downloadCount: s.downloadCount || 0,
                            downloadUrl: `${origin}/api/samples/${s.id}/download`,
                            waveformUrl: `${origin}/api/samples/${s.id}/waveform`,
                            createdAt: s.createdAt || Date.now(),
                        };
                        samplesMap.set(`${origin}:${sd.id}`, sd);
                        licensesSet.add(sd.license);
                        sd.tags.forEach(t => tagsSet.add(t));
                    });
                } catch (err) {}

                try {
                    const res = await fetch(`${origin}/api/sample-packs?limit=100`, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) return;
                    const packs = await res.json();
                    (Array.isArray(packs) ? packs : []).forEach(p => {
                        if (!p || !p.id) return;
                        packsMap.set(`${origin}:${p.id}`, {
                            id: p.id, title: p.title || 'Untitled Pack',
                            artistName: p.artistName || 'Unknown Artist',
                            license: p.license || 'cc0', sampleCount: p.sampleCount || 0,
                            pageUrl: `${origin}/samples/pack/${p.id}`,
                            coverUrl: `${origin}/api/sample-packs/${p.id}/cover`,
                            createdAt: p.createdAt || Date.now(),
                        });
                        licensesSet.add(p.license || 'cc0');
                    });
                } catch (err) {}

                updateSamplesList(samplesMap, packsMap, licensesSet, tagsSet);
            };

            const directories = Array.isArray(window.TUNECAMP_DIRECTORY) ? window.TUNECAMP_DIRECTORY : [];
            if (directories.length === 0) {
                setStatus('offline');
            } else {
                setStatus('connecting');
                let reached = 0;
                await Promise.all(directories.map(async (base) => {
                    const origin = (base || '').replace(/\/$/, '');
                    if (!origin) return;
                    try {
                        const res = await fetch(`${origin}/api/community/sites`, { headers: { 'Accept': 'application/json' } });
                        if (!res.ok) return;
                        const sites = await res.json();
                        reached++;
                        await Promise.all((Array.isArray(sites) ? sites : []).map(s => processSite(s.url)));
                    } catch (err) {}
                }));
                setStatus(reached > 0 ? 'live' : 'offline');
            }

            setTimeout(() => {
                if (allSamples.length === 0 && allPacks.length === 0) {
                    document.getElementById('samplesContainer').innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center h-64 text-center p-8">
                            <i class="fas fa-drum text-4xl text-white/20 mb-4"></i>
                            <p class="text-text-muted">No samples found yet. Join the network!</p>
                        </div>
                    `;
                }
            }, 5000);
        }

        function updateSamplesList(samplesMap, packsMap, licensesSet, tagsSet) {
            allSamples = Array.from(samplesMap.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            allPacks = Array.from(packsMap.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById('sampleCount').textContent = allSamples.length + allPacks.length;

            const select = document.getElementById('licenseFilter');
            const current = select.value;
            select.innerHTML = '<option value="" class="bg-bg-surface text-white">All Licenses</option>';
            Array.from(licensesSet).sort().forEach(l => {
                select.innerHTML += `<option value="${escapeHtml(l)}" class="bg-bg-surface text-white">${escapeHtml(l.toUpperCase())}</option>`;
            });
            select.value = current;

            const tagSelect = document.getElementById('tagFilter');
            const currentTag = tagSelect.value;
            tagSelect.innerHTML = '<option value="" class="bg-bg-surface text-white">All Tags</option>';
            Array.from(tagsSet).sort().forEach(t => {
                tagSelect.innerHTML += `<option value="${escapeHtml(t)}" class="bg-bg-surface text-white">${escapeHtml(t)}</option>`;
            });
            tagSelect.value = currentTag;

            filterSamples();
        }

        function filterSamples() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const lic = document.getElementById('licenseFilter').value;
            const tag = document.getElementById('tagFilter').value;
            filteredSamples = allSamples.filter(s => {
                const mq = !q || s.title.toLowerCase().includes(q) || s.artistName.toLowerCase().includes(q);
                const ml = !lic || s.license === lic;
                const mt = !tag || s.tags.includes(tag);
                return mq && ml && mt;
            });
            filteredPacks = allPacks.filter(p => {
                const mq = !q || p.title.toLowerCase().includes(q) || p.artistName.toLowerCase().includes(q);
                const ml = !lic || p.license === lic;
                return mq && ml && !tag;
            });
            renderSamples();
        }

        function renderSamples() {
            const container = document.getElementById('samplesContainer');
            if (filteredSamples.length === 0 && filteredPacks.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-text-muted">No samples match your search.</div>`;
                return;
            }
            const packCards = filteredPacks.map(p => `
                <a href="${escapeHtml(p.pageUrl)}" class="sample-card">
                    <div class="pack-cover"><img src="${escapeHtml(p.coverUrl)}" alt="${escapeHtml(p.title)}" class="w-full h-full object-cover" loading="lazy"></div>
                    <div>
                        <div class="text-white font-medium truncate">${escapeHtml(p.title)}</div>
                        <div class="text-xs text-primary truncate">${escapeHtml(p.artistName)}</div>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        <span class="badge">${p.sampleCount} sample${p.sampleCount === 1 ? '' : 's'}</span>
                        <span class="badge">${escapeHtml((p.license || '').toUpperCase())}</span>
                    </div>
                </a>
            `).join('');
            const sampleCards = filteredSamples.map(s => {
                const badges = [
                    s.bpm ? `<span class="badge">${s.bpm} BPM</span>` : '',
                    s.musicalKey ? `<span class="badge">${escapeHtml(s.musicalKey)}</span>` : '',
                    s.format ? `<span class="badge">${escapeHtml(s.format.toUpperCase())}</span>` : '',
                    `<span class="badge">${escapeHtml((s.license || '').toUpperCase())}</span>`,
                ].filter(Boolean).join('');
                return `
                    <div class="sample-card">
                        <div class="sample-cover" onmouseenter="previewSample(this, '${escapeHtml(s.downloadUrl)}')" onmouseleave="stopPreview(this)">
                            <div class="sample-wave" style="-webkit-mask-image:url('${escapeHtml(s.waveformUrl)}');mask-image:url('${escapeHtml(s.waveformUrl)}')"></div>
                            <div class="sample-wave-progress" style="-webkit-mask-image:url('${escapeHtml(s.waveformUrl)}');mask-image:url('${escapeHtml(s.waveformUrl)}')"></div>
                            <div class="sample-play"><i class="fas fa-play"></i></div>
                        </div>
                        <div>
                            <div class="text-white font-medium truncate">${escapeHtml(s.title)}</div>
                            <div class="text-xs text-primary truncate">${escapeHtml(s.artistName)}</div>
                        </div>
                        <div class="flex flex-wrap gap-1.5">${badges}</div>
                        <a href="${escapeHtml(s.downloadUrl)}" class="text-center bg-primary/20 text-primary border border-primary/30 rounded-xl py-2 hover:bg-primary/30 transition-colors text-sm font-medium">
                            <i class="fas fa-download mr-1.5"></i>Download
                        </a>
                    </div>
                `;
            }).join('');
            container.innerHTML = packCards + sampleCards;
        }

        function escapeHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : ''; }

        const previewAudio = new Audio();
        let previewEl = null;
        previewAudio.addEventListener('timeupdate', () => {
            if (!previewEl || !previewAudio.duration) return;
            const pct = (1 - previewAudio.currentTime / previewAudio.duration) * 100;
            previewEl.querySelector('.sample-wave-progress').style.clipPath = `inset(0 ${pct}% 0 0)`;
        });

        function previewSample(el, url) {
            previewEl = el;
            previewAudio.src = url;
            previewAudio.currentTime = 0;
            previewAudio.play().catch(() => {});
        }

        function stopPreview(el) {
            previewAudio.pause();
            el.querySelector('.sample-wave-progress').style.clipPath = 'inset(0 100% 0 0)';
            previewEl = null;
        }

        window.filterSamples = filterSamples;
        window.previewSample = previewSample;
        window.stopPreview = stopPreview;
        loadSamples();
    </script>
</body>
</html>
